- name: Roles
  hosts: all
  vars:
    url: google.com
  tasks:
    - name: Copy file
      ansible.builtin.copy:
        src: url.txt
        dest: /tmp/furl.txt

    - name: Copy Template
      ansible.builtin.template:
        src: url.txt
        dest: /tmp/turl.txt

    - name: template nginx
      ansible.builtin.template:
        src: nginx.conf
        dest: /tmp/nginx.conf
      vars:
        app_names:
          - orders
          - ratings
          - payment
          - shipping
          - cart
          - user
          - catalogue
