- name: Variables from inventory file
  hosts: sample
  tasks:
    - name: Print Variables
      ansible.builtin.debug:
        msg: Host Var - {{ url_host }} , Group Var - {{ url_group }}


- name: Play variables
  hosts: all
  vars:
    url_play: play.example.com
  vars_files:
    - exvars.yml
  tasks:
    - name: Print Variable
      debug:
        msg: Play Var - {{ url_play }} - Play file var - {{ url_file }}

- name: Role variables
  hosts: all
  roles:
    - demo

- name: Task variable
  hosts: all
  tasks:
    - name: Print Variables
      ansible.builtin.debug:
        msg: Tasks Var - {{url_task }}
      vars:
        url_task: task.example.com

- name: Variable from cli
  hosts: all
  tasks:
    - name: Print Variables
      ansible.builtin.debug:
        msg: CLI Var - {{ url_cli }}






