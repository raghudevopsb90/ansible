- name: Condition
  hosts: localhost
  connection: local
  become: yes
  tasks:
    - name: Install Nginx only on RedHat
      ansible.builtin.debug:
        msg: Install nginx
      when: ansible_facts['os_family'] == "RedHat"\

    - name: Install Nginx only on Debian
      ansible.builtin.debug:
        msg: Install nginx
      when: ansible_facts['os_family'] == "Debian"


